<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- bridge -->
    <title>A real server</title>
  </head>
  <body>
    <h1>A real server</h1>
    <p id="answer">No answer yet</p>
    <script>
      async function ask() {
        const res = await fetch("/hello");
        const data = await res.json();
        const answer =
          document.getElementById("answer");
        answer.textContent = data.message;
      }
      liveIsh.hooks({ ask });
    </script>
  </body>
</html>
