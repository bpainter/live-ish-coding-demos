# Trigger prompts and golden tasks in Claude Code. Nightly, on protected branches. Warns only.
# It has no pull_request trigger, so a fork can never reach the secret, and it does nothing without it.
name: agent-evals

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-evals:
    if: github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: agent-evals
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Stop when there is no key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No key, so nothing runs."; fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.key.outputs.present == 'true'
        uses: ./.github/actions/setup
      - if: steps.key.outputs.present == 'true'
        run: pnpm evals:claude --run --model haiku --budget 2
