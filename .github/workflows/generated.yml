# Rebuilds theme outputs and the README theme line, compares skills to their source, and fails on any difference. Blocks merge.
name: generated

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm gen:themes
      - run: pnpm gen:readme
      # From the repo root, not a deck: a deck checks its own skills, and the starter has none.
      - run: pnpm live-ish skills sync --check
      - name: Fail on any difference, new files included
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
