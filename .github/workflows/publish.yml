# Stages all four packages. Nothing goes live from here: a maintainer reads the tarballs, then
# approves each one with 2FA. See docs/content/release.mdx.
#
# This cannot run until the owner has done all of these:
#   1. Set the PUBLISH_ENABLED repository variable to true.
#   2. Created the npm-publish environment, with required reviewers.
#   3. Set this repo and this workflow as a trusted publisher on npm, for each package.
#
# There is no npm token, here or in any secret. The id-token permission is the only credential.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    if: vars.PUBLISH_ENABLED == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Publishing is on for this repository."

  static:
    needs: gate
    uses: ./.github/workflows/static.yml
  unit:
    needs: gate
    uses: ./.github/workflows/unit.yml
  pack:
    needs: gate
    uses: ./.github/workflows/pack.yml
  starter:
    needs: gate
    uses: ./.github/workflows/starter.yml
  conformance:
    needs: gate
    uses: ./.github/workflows/conformance.yml
  readme:
    needs: gate
    uses: ./.github/workflows/readme.yml
  themes:
    needs: gate
    uses: ./.github/workflows/themes.yml
  cross-browser:
    needs: gate
    uses: ./.github/workflows/cross-browser.yml
  offline:
    needs: gate
    uses: ./.github/workflows/offline.yml
  theme-budgets:
    needs: gate
    uses: ./.github/workflows/theme-budgets.yml
  budgets:
    needs: gate
    uses: ./.github/workflows/budgets.yml
    with:
      blocking: true
  hosting:
    needs: gate
    uses: ./.github/workflows/hosting.yml
  generated:
    needs: gate
    uses: ./.github/workflows/generated.yml
  skills:
    needs: gate
    uses: ./.github/workflows/skills.yml
  matrix:
    needs: gate
    uses: ./.github/workflows/matrix.yml

  # Every check above left its numbers as a results-* artifact. They go on a draft release for this
  # tag, which a maintainer publishes from the changelog, so each number has a file with a public
  # address. This job checks out no code, and only it can write to the repository.
  results:
    needs: [static, unit, pack, starter, conformance, readme, themes, cross-browser, offline, theme-budgets, budgets, hosting, generated, skills, matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: raw-results
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "raw-results-$TAG.tar.gz" raw-results
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "raw-results-$TAG.tar.gz" --clobber
          else
            gh release create "$TAG" "raw-results-$TAG.tar.gz" --draft --verify-tag --title "$TAG" --notes "Raw results from CI are attached. Replace this with the changelog, then publish."
          fi

  stage:
    needs: results
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Pack with pnpm, so workspace ranges become versions
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for pkg in engine verify bridge create; do
            pnpm --dir "packages/$pkg" pack --pack-destination "$RUNNER_TEMP/tarballs"
          done
      - name: Stage each tarball under the next tag
        run: |
          for tarball in "$RUNNER_TEMP"/tarballs/*.tgz; do
            npm stage publish "$tarball" --tag next --access public --provenance
          done
