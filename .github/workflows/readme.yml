# Runs the README quick start and the docs Quickstart from a blank folder, then checks line count and links, including a link check over the built docs. Blocks merge.
name: readme

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm gen:readme --check
      - run: node --import tsx --test scripts/test/readme.test.mts
      - run: node --import tsx scripts/ci/quickstart.mts README.md "Quick start"
      - run: node --import tsx scripts/ci/quickstart.mts docs/content/start.mdx
      - run: pnpm docs:build
      - run: pnpm --filter docs check:links
