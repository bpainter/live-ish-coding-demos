# WebKit and Firefox on the conformance deck and the starter. Nightly and before a release, which it blocks.
name: cross-browser

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    # WebKit runs on macOS, the closest a runner gets to Safari.
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
        deck: [conformance, starter]
    env:
      BROWSER: ${{ matrix.browser }}
      DECK: ${{ matrix.deck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
      - uses: ./.github/actions/start-deck
        with:
          deck: ${{ matrix.deck }}
          port: 3400
      - run: pnpm --filter "$DECK" exec live-ish walk --browser="$BROWSER" --origin=http://localhost:3400
      - run: pnpm --filter "$DECK" exec live-ish walk --mode=keys --browser="$BROWSER" --origin=http://localhost:3400
      - run: pnpm --filter "$DECK" exec live-ish walk --mode=a11y --browser="$BROWSER" --origin=http://localhost:3400
