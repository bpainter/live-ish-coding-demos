# The underlay walk, on captured posters, and the load budget per theme. Nightly. Blocks a release.
name: theme-budgets

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: theme-budgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read the theme ids from the theme files
        id: ids
        run: echo "ids=$(pnpm --silent --filter starter exec live-ish themes --json | node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync(0)).themes.map((t) => t.id)))')" >> "$GITHUB_OUTPUT"

  theme:
    needs: list
    runs-on: ubuntu-24.04
    # See budgets.yml: one theme's underlay walk takes about 30 minutes alone.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.list.outputs.ids) }}
    env:
      THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - uses: ./.github/actions/start-deck
        with:
          deck: conformance
          port: 3400
          all-fonts: "1"
          capture: "1"
      - run: pnpm --silent --filter conformance exec live-ish walk --mode=underlay --chrome="$THEME" --origin=http://localhost:3400 --json > "$RESULTS/walk-underlay-$THEME.json"
      - run: pnpm --silent --filter conformance exec live-ish perf load --chrome="$THEME" --origin=http://localhost:3400 --json > "$RESULTS/perf-load-$THEME.json"
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-results
        with:
          name: theme-budgets-${{ matrix.theme }}
