name: Docs
description: A page is wrong, missing or hard to follow.
labels: [docs]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://live-ish.vercel.app/web-demos
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the sentence, if there is one.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What it should say
