# One grouped pull request a month, with a three-day cooldown that matches `minimumReleaseAge` in
# pnpm-workspace.yaml. Security updates skip the group and arrive as they are published. The urgent
# fix path is in CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # TypeScript stays on 5.x until the toolchain is proven on the next major.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
