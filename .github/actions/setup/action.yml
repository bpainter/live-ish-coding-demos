name: Set up
description: Node from .nvmrc, pnpm from packageManager through Corepack, and a frozen install. Optionally one or more Playwright browsers.

inputs:
  node-version:
    description: Overrides .nvmrc.
    required: false
    default: ""
  browsers:
    description: Space-separated Playwright browsers to install, such as "chromium webkit".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Find the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install browsers
      if: inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: pnpm exec playwright install --with-deps $BROWSERS

    - name: Make a folder for raw results
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/results"
        echo "RESULTS=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
