<link rel="stylesheet" href="grid.css">
<section class="panel" id="root">
  <h2 id="heading" data-kind="log">
    Assert grammar
  </h2>
  <div id="grid" class="grid">
    <span class="cell">A</span>
    <span class="cell">B</span>
  </div>
  <label for="field">Field</label>
  <input id="field" value="three">
  <p id="gone" hidden>Hidden text</p>
  <div id="box" class="box">Box</div>
  <button
    id="pop"
    type="button"
    popovertarget="tip"
  >
    Tip
  </button>
  <div id="tip" popover>A popover</div>
</section>
